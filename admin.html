<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A0A4A">
<title>Admin · Royale Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:#FBF6EA;color:#2A0A4A;line-height:1.5}
header{background:#1B0630;border-bottom:2px solid #D4A62A;color:#F2CF66}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;padding-bottom:14px}
header img{width:44px;height:44px;vertical-align:middle;margin-right:10px}
header b{font-family:Georgia,serif;letter-spacing:.08em;font-size:20px}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
main{padding:28px 0 60px}
.box{background:#fff;border:1px solid #E6DCC3;border-radius:16px;padding:24px;max-width:420px;margin:24px auto}
h1,h2{margin:0 0 14px;font-family:Georgia,serif}
label{display:block;font-weight:600;margin-bottom:14px}
input,select{width:100%;padding:12px;font-size:16px;border:1.5px solid #CDB8E3;border-radius:10px;margin-top:6px;font-family:inherit;background:#fff;color:#2A0A4A}
button,.btn{font-family:inherit;font-size:16px;font-weight:600;border:0;border-radius:999px;padding:13px 24px;background:#2A0A4A;color:#F2CF66;cursor:pointer;min-height:44px}
button:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:#F2CF66;border:2px solid #F2CF66;padding:9px 18px}
.err{color:#9B1C1C;background:#FDECEC;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.stat{flex:1 1 150px;background:#fff;border:1px solid #E6DCC3;border-radius:14px;padding:14px 16px}
.stat span{display:block;font-size:13px;color:#5B4A70}
.stat b{font-size:24px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.tools input{flex:1 1 220px;margin:0}
#list{display:flex;flex-direction:column;gap:14px}
.order{background:#fff;border:1px solid #E6DCC3;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.order .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline}
.order h3{margin:0;font-size:19px}
.order .date{font-size:13px;color:#5B4A70}
.order .contact{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.order .phone{font-size:20px;font-weight:700;color:#2A0A4A}
.order .wa{color:#0E6FA3;font-weight:600}
.order .mail{color:#5B4A70;font-size:15px;overflow-wrap:anywhere}
.order .item{font-weight:500}
.order .statut{max-width:280px;margin:4px 0 0}
#empty{text-align:center;color:#5B4A70;padding:30px 0}
</style>
</head>
<body>
<header>
<div class="wrap">
<div><img src="logo-ar.png" alt=""><b>ROYALE SHOPPING · ADMIN</b></div>
<button class="ghost" id="logoutBtn" type="button" hidden>Se déconnecter</button>
</div>
</header>

<main class="wrap">
<section id="loginBox" class="box">
<h1>Connexion admin</h1>
<form id="loginForm">
<p class="err" id="loginErr" role="alert" hidden></p>
<label>Email<input name="email" type="email" autocomplete="username" required></label>
<label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Se connecter</button>
</form>
</section>

<section id="panel" hidden>
<p style="margin:0 0 16px;color:#5B4A70">Connecté : <b id="who"></b></p>
<p class="err" id="panelErr" role="alert" hidden></p>
<div class="stats">
<div class="stat"><span>Commandes</span><b id="statTotal">0</b></div>
<div class="stat"><span>En attente de paiement</span><b id="statWait">0</b></div>
<div class="stat"><span>Payées ou livrées</span><b id="statPaid">0</b></div>
<div class="stat"><span>Montant encaissé</span><b id="statSum">0 FCFA</b></div>
</div>
<div class="tools">
<input id="search" type="search" placeholder="Rechercher un nom, un numéro, un email" aria-label="Rechercher">
<button id="exportBtn" type="button">Exporter en CSV</button>
</div>
<div id="list"></div>
<p id="empty" hidden>Aucune commande pour le moment.</p>
</section>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
